<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bosak AI - Book Creator</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #070b16;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1224;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #9b5cff;
    }

    a {
      color: white;
      text-decoration: none;
    }

    a:hover {
      color: #b99cff;
    }

    .hero {
      max-width: 900px;
      margin: 80px auto;
      text-align: center;
      padding: 20px;
    }

    .hero h1 {
      font-size: 56px;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 22px;
      color: #c7c7c7;
      margin-bottom: 40px;
    }

    .form {
      background: #11182c;
      padding: 30px;
      border-radius: 20px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 15px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: #1a2340;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #7b4dff;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 30px;
      width: 100%;
      padding: 18px;
      font-size: 20px;
      font-weight: 600;
      background: #7b4dff;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #6b3dff;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .result {
      margin-top: 40px;
      background: #11182c;
      padding: 24px;
      border-radius: 16px;
      min-height: 150px;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #d9deea;
    }

    .success {
      color: #86efac;
    }

    .error {
      color: #fca5a5;
    }

    .notice {
      color: #fde68a;
    }

    @media (max-width: 700px) {
      .hero {
        margin: 40px auto;
      }

      .hero h1 {
        font-size: 40px;
      }

      .hero p {
        font-size: 18px;
      }

      .form {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Bosak AI</div>

    <a href="index.html">
      ← Back
    </a>
  </header>

  <main>
    <section class="hero">

      <h1>AI Book Creator</h1>

      <p>
        Create and save your next book project with Bosak AI.
      </p>

      <div class="form">

        <label for="title">Book Title</label>
        <input
          id="title"
          type="text"
          placeholder="Example: Ukrainian Valentine’s Day Coloring Book"
          autocomplete="off"
        >

        <label for="language">Language</label>
        <select id="language">
          <option value="English">English</option>
          <option value="Українська">Українська</option>
          <option value="Polski">Polski</option>
        </select>

        <label for="description">Book Description</label>
        <textarea
          id="description"
          rows="6"
          placeholder="Describe the book you want to create..."
        ></textarea>

        <button id="generateButton" type="button">
          Generate Book
        </button>

      </div>

      <div class="result" id="result">
        Your generated content will appear here.
      </div>

    </section>
  </main>

  <script>
    const SUPABASE_URL =
      "https://jmzgxexdfgpumekoswgh.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_zjy98CSFllj7JIA-ynqOWg__PlZ0456";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const generateButton =
      document.getElementById("generateButton");

    generateButton.addEventListener(
      "click",
      generateBook
    );

    async function generateBook() {
      const title =
        document.getElementById("title").value.trim();

      const language =
        document.getElementById("language").value;

      const description =
        document.getElementById("description").value.trim();

      const result =
        document.getElementById("result");

      if (!title || !description) {
        showMessage(
          "Please enter a book title and description.",
          "error"
        );

        return;
      }

      setLoading(true);

      showMessage(
        "Checking your account...",
        "notice"
      );

      try {
        const {
          data: { session },
          error: sessionError
        } = await db.auth.getSession();

        if (sessionError) {
          throw sessionError;
        }

        if (!session) {
          showMessage(
            'Please sign in before creating a book.<br><br><a href="login.html">Go to Sign In →</a>',
            "notice"
          );

          return;
        }

        showMessage(
          "Saving your book project...",
          "notice"
        );

        const { data, error } = await db
          .from("books")
          .insert([
            {
              title: title,
              language: language,
              description: description,
              content: "",
              status: "draft"
            }
          ])
          .select();

        if (error) {
          throw error;
        }

        result.innerHTML = `
          <h2>${escapeHtml(title)}</h2>

          <br>

          <strong>Language:</strong>
          ${escapeHtml(language)}

          <br><br>

          <strong>Description:</strong>

          <br>

          ${escapeHtml(description)}

          <br><br>

          <strong class="success">
            ✅ Project saved to Bosak AI.
          </strong>
        `;

        console.log(
          "Saved project:",
          data
        );

      } catch (error) {
        console.error(error);

        showMessage(
          "Could not save the project: " +
          escapeHtml(error.message || "Unknown error"),
          "error"
        );

      } finally {
        setLoading(false);
      }
    }

    function showMessage(
      message,
      type = ""
    ) {
      const result =
        document.getElementById("result");

      result.className =
        "result " + type;

      result.innerHTML =
        message;
    }

    function setLoading(isLoading) {
      generateButton.disabled =
        isLoading;

      generateButton.textContent =
        isLoading
          ? "Working..."
          : "Generate Book";
    }

    function escapeHtml(value) {
      const text =
        String(value ?? "");

      return text.replace(
        /[&<>"']/g,
        function (char) {
          const map = {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          };

          return map[char];
        }
      );
    }
  </script>

</body>
</html>
